<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>페이지를 찾을 수 없습니다 | 테넷</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>body{font-family:"Pretendard Variable",Pretendard,sans-serif;background:#0E0D0C;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0;text-align:center}
.dot{width:14px;height:14px;border-radius:50%;background:#FF5A1F;margin:0 auto 20px;animation:b 1.4s infinite}@keyframes b{50%{opacity:.2}}
h1{font-size:44px;font-weight:900;letter-spacing:-.02em;margin:0 0 10px}p{color:#9A9AA3;margin:0 0 28px}
a{color:#fff;border:1.5px solid #fff;padding:13px 22px;text-decoration:none;font-weight:800;border-radius:2px}</style></head>
<body><div><div class="dot"></div><h1>여긴 녹음된 게 없네요.</h1><p>주소가 바뀌었거나 없는 페이지입니다.</p><a href="/">첫 화면으로</a></div></body></html>
